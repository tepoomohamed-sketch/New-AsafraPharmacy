[build]
  publish = "."

[[redirects]]
  from = "/app"
  to   = "/pharma-saas-v1.html"
  status = 200

[[redirects]]
  from = "/"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-store"
