<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<title>رفع البيانات لـ Supabase</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f1117;color:#e2e8f0;padding:30px 20px;min-height:100vh;}
h1{color:#68d391;font-size:1.3rem;margin-bottom:6px;}
.sub{color:#a0aec0;font-size:.85rem;margin-bottom:24px;}
.card{background:#161b27;border:1px solid #2d3748;border-radius:14px;padding:22px;margin-bottom:16px;}
.card h2{font-size:.95rem;color:#90cdf4;margin-bottom:14px;font-weight:700;}
.drop{border:2px dashed #4a5568;border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;}
.drop:hover,.drop.over{border-color:#68d391;background:rgba(56,161,105,.07);}
.drop input{display:none;}
.drop-icon{font-size:2.5rem;margin-bottom:10px;}
.drop-txt{color:#a0aec0;font-size:.9rem;}
.drop-txt strong{color:#e2e8f0;}
.btn{padding:11px 22px;border-radius:10px;border:none;cursor:pointer;font-size:.9rem;font-weight:700;transition:all .2s;}
.btn-green{background:#276749;color:#fff;} .btn-green:hover{background:#38a169;}
.btn:disabled{opacity:.45;cursor:not-allowed;}
.preview{background:#0f1117;border-radius:10px;padding:14px;font-size:.85rem;}
.preview-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #2d3748;}
.preview-row:last-child{border:none;}
.preview-lbl{color:#a0aec0;}
.preview-val{font-weight:700;color:#68d391;}
.log{background:#0a0e18;border:1px solid #2d3748;border-radius:10px;padding:14px;height:200px;overflow-y:auto;font-size:.78rem;font-family:monospace;line-height:1.8;}
.log .ok{color:#68d391;} .log .err{color:#fc8181;} .log .info{color:#90cdf4;}
.progress-bar{height:8px;background:#2d3748;border-radius:4px;margin-top:12px;overflow:hidden;}
.progress-fill{height:100%;background:#38a169;border-radius:4px;transition:width .3s;width:0%;}
.done-box{background:rgba(56,161,105,.12);border:1.5px solid rgba(56,161,105,.4);border-radius:12px;padding:16px;text-align:center;display:none;}
.done-box .big{font-size:2rem;margin-bottom:6px;}
.done-box p{color:#a0aec0;font-size:.85rem;}
</style>
</head>
<body>

<h1>📤 رفع البيانات لـ Supabase</h1>
<p class="sub">ارفع ملف pharmacy_bkp_*.json لنقل القيود لـ Supabase</p>

<!-- FILE DROP -->
<div class="card">
  <h2>📁 اختر ملف النسخة الاحتياطية</h2>
  <div class="drop" id="dropZone" onclick="document.getElementById('fileIn').click()"
       ondragover="event.preventDefault();this.classList.add('over')"
       ondragleave="this.classList.remove('over')"
       ondrop="handleDrop(event)">
    <input type="file" id="fileIn" accept=".json" onchange="loadFile(this.files[0])"/>
    <div class="drop-icon">📂</div>
    <div class="drop-txt">اسحب الملف هنا أو <strong>اضغط للاختيار</strong></div>
    <div class="drop-txt" style="margin-top:6px;font-size:.78rem;">pharmacy_bkp_YYYY-MM-DD.json</div>
  </div>
</div>

<!-- PREVIEW -->
<div class="card" id="previewCard" style="display:none;">
  <h2>📊 معاينة البيانات</h2>
  <div class="preview" id="previewBox"></div>
  <button class="btn btn-green" id="uploadBtn" onclick="startUpload()" style="margin-top:16px;">🚀 ابدأ الرفع لـ Supabase</button>
</div>

<!-- PROGRESS -->
<div class="card" id="progressCard" style="display:none;">
  <h2>⚡ جاري الرفع</h2>
  <div class="log" id="logBox"></div>
  <div class="progress-bar"><div class="progress-fill" id="progFill"></div></div>
  <div style="font-size:.8rem;color:#a0aec0;margin-top:8px;" id="progTxt">0 / 0</div>
</div>

<!-- DONE -->
<div class="done-box" id="doneBox">
  <div class="big">🎉</div>
  <strong style="font-size:1.1rem;color:#68d391;">اكتمل النقل بنجاح!</strong>
  <p style="margin-top:8px;" id="doneDetail"></p>
</div>

<script>
const SB_URL = "https://pjrmwnntmkrkemwhqppw.supabase.co";
const SB_KEY = "sb_publishable_MAtXmU9YNSzBZJwgUsZnNA_PlFbA7uE";

let jsonData = null;

function handleDrop(e) {
  e.preventDefault();
  document.getElementById('dropZone').classList.remove('over');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
}

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      jsonData = JSON.parse(e.target.result);
      if (!Array.isArray(jsonData.entries)) {
        alert('❌ ملف غير صالح — لا يوجد مصفوفة entries');
        return;
      }
      showPreview();
    } catch(err) {
      alert('❌ خطأ في قراءة الملف: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function showPreview() {
  const e = jsonData.entries;
  const types = {};
  e.forEach(x => { types[x.type] = (types[x.type]||0)+1; });
  const dates = e.map(x=>x.date).filter(Boolean).sort();
  const totalAmt = e.filter(x=>x.type==='ايرادات'||x.type==='ارباح').reduce((s,x)=>s+(x.amount||0),0);

  document.getElementById('previewBox').innerHTML = `
    <div class="preview-row"><span class="preview-lbl">إجمالي القيود</span><span class="preview-val">${e.length} قيد</span></div>
    <div class="preview-row"><span class="preview-lbl">إيرادات</span><span class="preview-val">${types['ايرادات']||0}</span></div>
    <div class="preview-row"><span class="preview-lbl">مصاريف</span><span class="preview-val">${types['مصاريف']||0}</span></div>
    <div class="preview-row"><span class="preview-lbl">طلبيات</span><span class="preview-val">${types['طلبيات']||0}</span></div>
    <div class="preview-row"><span class="preview-lbl">أرباح</span><span class="preview-val">${types['ارباح']||0}</span></div>
    <div class="preview-row"><span class="preview-lbl">من تاريخ</span><span class="preview-val">${dates[0]||'—'}</span></div>
    <div class="preview-row"><span class="preview-lbl">لتاريخ</span><span class="preview-val">${dates[dates.length-1]||'—'}</span></div>
    <div class="preview-row"><span class="preview-lbl">إجمالي الإيرادات</span><span class="preview-val">${totalAmt.toLocaleString('ar-EG')} ج</span></div>
  `;
  document.getElementById('previewCard').style.display = '';
}

function log(msg, type='info') {
  const box = document.getElementById('logBox');
  const line = document.createElement('div');
  line.className = type;
  line.textContent = '[' + new Date().toLocaleTimeString('ar-EG') + '] ' + msg;
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

async function sbUpsert(table, rows) {
  const res = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: {
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates'
    },
    body: JSON.stringify(rows)
  });
  if (!res.ok) {
    const err = await res.json().catch(()=>({message:res.statusText}));
    throw new Error(err.message || res.statusText);
  }
}

async function startUpload() {
  if (!jsonData) return;
  document.getElementById('uploadBtn').disabled = true;
  document.getElementById('progressCard').style.display = '';

  const entries = jsonData.entries;
  const CHUNK = 100;
  let done = 0;
  let errors = 0;

  log(`📡 بدء رفع ${entries.length} قيد...`, 'info');

  for (let i = 0; i < entries.length; i += CHUNK) {
    const chunk = entries.slice(i, i + CHUNK).map(x => ({
      id:              x.id || (Math.random().toString(36).slice(2)),
      date:            x.date            || '',
      type:            x.type            || '',
      company:         x.company         || '',
      invoice:         x.invoice         || '',
      amount:          x.amount          || 0,
      notes:           x.notes           || '',
      uid:             x.uid             || '',
      uname:           x.uname           || '',
      balance:         x.balance         || 0,
      time:            x.time            || '',
      ts:              x.ts              || Date.now(),
      pos_reviewed:    x.posReviewed     || false,
      pos_reviewed_at: x.posReviewedAt   || null,
      pos_reviewed_by: x.posReviewedBy   || null
    }));

    try {
      await sbUpsert('entries', chunk);
      done += chunk.length;
    } catch(e) {
      errors += chunk.length;
      log(`❌ خطأ في chunk ${i}-${i+CHUNK}: ${e.message}`, 'err');
    }

    const pct = Math.round((i + CHUNK) / entries.length * 100);
    document.getElementById('progFill').style.width = Math.min(pct,100) + '%';
    document.getElementById('progTxt').textContent = `${Math.min(done+errors, entries.length)} / ${entries.length}`;
    log(`✅ ${Math.min(i+CHUNK, entries.length)} / ${entries.length} قيد`, 'ok');
  }

  document.getElementById('progFill').style.width = '100%';

  if (errors === 0) {
    log('🎉 اكتمل النقل بنجاح!', 'ok');
    const doneBox = document.getElementById('doneBox');
    document.getElementById('doneDetail').textContent = `تم رفع ${done} قيد بنجاح لـ Supabase`;
    doneBox.style.display = '';
  } else {
    log(`⚠️ اكتمل مع ${errors} خطأ — ${done} نجح`, 'err');
  }
}
</script>
</body>
</html>
