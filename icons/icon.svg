<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2338"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#071522"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing rings -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#00b4d8" stroke-width="3" opacity="0.25" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="200" fill="#111c30" stroke="#00b4d8" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="185" fill="#16253d" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>

  <!-- Medical Cross -->
  <g fill="url(#crossGrad)" filter="url(#glow)">
    <rect x="216" y="96" width="80" height="320" rx="28"/>
    <rect x="96" y="216" width="320" height="80" rx="28"/>
  </g>

  <!-- High-tech diagonal capsule -->
  <g transform="translate(256, 256) rotate(-45)">
    <!-- Pill body background / border -->
    <rect x="-110" y="-42" width="220" height="84" rx="42" fill="#0c2338" stroke="#ffffff" stroke-width="4"/>
    <!-- Left half: Cyan -->
    <path d="M -110 0 A 42 42 0 0 1 -68 -42 L 0 -42 L 0 42 L -68 42 A 42 42 0 0 1 -110 0 Z" fill="url(#cyanGrad)"/>
    <!-- Right half: White -->
    <path d="M 0 -42 L 68 -42 A 42 42 0 0 1 110 0 A 42 42 0 0 1 68 42 L 0 42 Z" fill="#ffffff"/>
    <!-- Center seam -->
    <line x1="0" y1="-42" x2="0" y2="42" stroke="#0c2338" stroke-width="4"/>
    <!-- Capsule Gloss Highlight -->
    <path d="M -75 -22 L 75 -22" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Pulse Heartbeat line (Gold/Amber) -->
  <path d="M 140 256 L 195 256 L 225 210 L 256 310 L 285 185 L 315 285 L 335 256 L 372 256" 
        fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>
