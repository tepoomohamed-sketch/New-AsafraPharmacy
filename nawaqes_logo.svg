<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1526"/>
      <stop offset="1" stop-color="#080C18"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="480" rx="88" fill="url(#bg)"/>

  <!-- capsule (pharmacy) -->
  <g transform="translate(240 195) rotate(-45)">
    <rect x="-92" y="-46" width="184" height="92" rx="46" fill="url(#icon)"/>
    <rect x="-92" y="-46" width="92" height="92" rx="46" fill="#0B2530" opacity=".28"/>
    <line x1="0" y1="-46" x2="0" y2="46" stroke="#031318" stroke-width="4" opacity=".35"/>
  </g>

  <!-- shortage / alert badge -->
  <circle cx="345" cy="110" r="52" fill="#F59E0B"/>
  <rect x="338" y="80" width="14" height="34" rx="7" fill="#1a0f00"/>
  <circle cx="345" cy="130" r="7.5" fill="#1a0f00"/>

  <!-- wordmark -->
  <text x="240" y="378" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="62" fill="#F4F4F5" letter-spacing="-1">Nawaqes</text>
</svg>
