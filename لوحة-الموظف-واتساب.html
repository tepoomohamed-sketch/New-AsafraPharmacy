<!DOCTYPE html>
<!--
  ==========================================================
  لوحة الموظف - إرسال واتساب للعميل
  ==========================================================
  الموظف يكتب رقم العميل وتفاصيل طلبه، ويدوس إرسال.
  هتفتح محادثة واتساب (واتساب ويب أو التطبيق) مع رقم العميل
  والرسالة جاهزة، والموظف يدوس "إرسال" جوه واتساب نفسه.

  ⚠️ ملحوظة مهمة: واتساب مش بيسمح لأي صفحة إنها تبعت رسالة
  تلقائي 100% من غير ما حد يدوس "إرسال" جوه واتساب - ده قيد من
  واتساب نفسه مش حاجة ينفع نتغلب عليها من غير واتساب بيزنس API
  (خدمة مدفوعة وتحتاج موافقة). فبالتالي الفلو هيبقى: كتابة
  البيانات هنا (كليك واحد) → واتساب بيفتح والرسالة جاهزة →
  دوسة إرسال جوه واتساب (كليك تاني). ده أسرع حل ومجاني تماماً.
  ==========================================================
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الموظف - صيدلية أصفرا</title>
<style>
  :root{
    --wa-green:#25D366;
    --wa-dark:#075E54;
    --bg:#f4f7f6;
    --card:#ffffff;
    --text:#1b1b1b;
    --muted:#6b7280;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Tahoma, Arial, sans-serif;
    background:var(--bg);
    min-height:100vh;
    color:var(--text);
  }
  .topbar{
    background:var(--wa-dark);
    color:#fff;
    padding:16px 20px;
    text-align:center;
  }
  .topbar h1{margin:0;font-size:19px;}
  .topbar p{margin:4px 0 0;font-size:12.5px;opacity:.85;}

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:20px 16px 60px;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:520px){ .grid{grid-template-columns:1fr;} }

  .card{
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 6px 20px rgba(0,0,0,.07);
    margin-bottom:16px;
  }
  .card h2{font-size:14.5px;margin:0 0 12px;color:var(--wa-dark);}

  label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;}
  input[type=text], input[type=tel], textarea{
    width:100%;
    border:1.5px solid #e5e7eb;
    border-radius:10px;
    padding:11px 12px;
    font-size:14.5px;
    font-family:inherit;
    resize:vertical;
  }
  textarea{min-height:100px;}
  input:focus, textarea:focus{outline:none;border-color:var(--wa-green);}

  .checkbox-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:16px;
    background:#f0fdf4;
    border:1.5px solid #bbf7d0;
    border-radius:10px;
    padding:12px 14px;
  }
  .checkbox-row input{width:18px;height:18px;accent-color:var(--wa-green);}
  .checkbox-row label{margin:0;font-size:13.5px;color:var(--text);}

  .send-btn{
    width:100%;
    margin-top:18px;
    background:var(--wa-green);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
  }
  .send-btn:active{transform:scale(.98);}
  .send-btn:disabled{opacity:.5;cursor:not-allowed;}

  .preview{
    width:100%;
    background:#e9fbf0;
    border:1.5px dashed #86efac;
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    font-family:inherit;
    white-space:pre-wrap;
    color:#065f46;
    margin-top:10px;
    min-height:110px;
    resize:vertical;
  }
  .preview:focus{outline:none;border-color:var(--wa-green);border-style:solid;}
  .preview-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
  }
  .preview-row label{margin:0;}
  .regen-btn{
    background:none;
    border:none;
    color:var(--wa-dark);
    font-size:12px;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }

  .log{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px 20px;
    box-shadow:0 6px 20px rgba(0,0,0,.07);
  }
  .log h2{font-size:14.5px;margin:0 0 10px;color:var(--wa-dark);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th, td{text-align:right;padding:8px 6px;border-bottom:1px solid #f0f0f0;}
  th{color:var(--muted);font-weight:600;}
  .empty-log{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;}
  .clear-log{
    font-size:12px;color:var(--muted);text-decoration:underline;
    cursor:pointer;float:left;
  }
  .status-badge{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    padding:10px 14px;
    border-radius:10px;
    margin-bottom:16px;
    font-weight:600;
  }
  .status-badge.connected{background:#e9fbf0;color:#065f46;border:1.5px solid #86efac;}
  .status-badge.disconnected{background:#fef2f2;color:#991b1b;border:1.5px solid #fecaca;}
  .status-badge.checking{background:#f3f4f6;color:var(--muted);border:1.5px solid #e5e7eb;}
  .status-dot{width:9px;height:9px;border-radius:50%;background:currentColor;}
</style>
</head>
<body>

<div class="topbar">
  <h1>💊 صيدلية أصفرا - لوحة الموظف</h1>
  <p>اكتب رقم العميل وتفاصيل الطلب وابعتله واتساب فوراً</p>
</div>

<div class="wrap">

  <div class="status-badge checking" id="statusBadge">
    <span class="status-dot"></span>
    <span id="statusText">جاري التحقق من الاتصال بواتساب...</span>
  </div>

  <div class="card">
    <div class="grid">
      <div>
        <label>رقم موبايل العميل *</label>
        <input type="tel" id="custPhone" placeholder="01xxxxxxxxx">
      </div>
      <div>
        <label>اسم العميل (اختياري)</label>
        <input type="text" id="custName" placeholder="اسم العميل">
      </div>
    </div>

    <label style="margin-top:16px;">تفاصيل / ملاحظات الطلب</label>
    <textarea id="orderDetails" placeholder="مثال: 2 علبة بانادول اكسترا + شراب سعال، الإجمالي 180 جنيه"></textarea>

    <div class="checkbox-row">
      <input type="checkbox" id="confirmReceived" checked>
      <label for="confirmReceived">إضافة عبارة "تم استلام طلبك" في الرسالة</label>
    </div>

    <div class="preview-row">
      <label>الرسالة (تقدر تعدلها زي ما تحب)</label>
      <button type="button" class="regen-btn" id="regenBtn">↺ إعادة توليد تلقائي</button>
    </div>
    <textarea class="preview" id="preview" placeholder="هتظهر هنا الرسالة أول ما تكتب بيانات الطلب..."></textarea>

    <button class="send-btn" id="sendBtn">
      <span>📲</span> إرسال واتساب للعميل
    </button>
  </div>

  <div class="log">
    <span class="clear-log" id="clearLog">مسح السجل</span>
    <h2>آخر الرسائل المُرسلة اليوم</h2>
    <table id="logTable">
      <thead><tr><th>الوقت</th><th>العميل</th><th>الرقم</th><th>طريقة الإرسال</th></tr></thead>
      <tbody id="logBody"></tbody>
    </table>
    <div class="empty-log" id="emptyLog">لسه مفيش رسائل مُرسلة</div>
  </div>

</div>

<script>
  // ====== إعدادات الصيدلية ======
  const PHARMACY_NAME = "صيدلية أصفرا";
  const DEFAULT_COUNTRY_CODE = "20"; // مصر - يتحط تلقائي لو الرقم مكتوب محلي (يبدأ بـ 0)
  const SERVER_URL = "http://localhost:3000"; // عنوان سيرفر الإرسال التلقائي (شغّاله على جهاز الصيدلية)
  // ================================

  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');

  async function checkServerStatus(){
    try{
      const res = await fetch(`${SERVER_URL}/status`, { signal: AbortSignal.timeout(3000) });
      const data = await res.json();
      if(data.ready){
        statusBadge.className = 'status-badge connected';
        statusText.textContent = '✅ متصل بواتساب - الإرسال هيبقى تلقائي';
      } else {
        statusBadge.className = 'status-badge disconnected';
        statusText.textContent = '⚠️ السيرفر شغال بس واتساب لسه مش متصل - افتح /qr واعمل مسح';
      }
    }catch(e){
      statusBadge.className = 'status-badge disconnected';
      statusText.textContent = '⚠️ سيرفر الإرسال التلقائي مش شغال - الإرسال هيبقى يدوي (كليك في واتساب)';
    }
  }
  checkServerStatus();
  setInterval(checkServerStatus, 8000);

  const phoneEl = document.getElementById('custPhone');
  const nameEl = document.getElementById('custName');
  const detailsEl = document.getElementById('orderDetails');
  const confirmEl = document.getElementById('confirmReceived');
  const previewEl = document.getElementById('preview');
  const sendBtn = document.getElementById('sendBtn');
  const logBody = document.getElementById('logBody');
  const emptyLog = document.getElementById('emptyLog');

  function normalizePhone(raw){
    let num = raw.replace(/[^0-9]/g, '');
    if(num.startsWith('0')) num = DEFAULT_COUNTRY_CODE + num.slice(1);
    else if(!num.startsWith(DEFAULT_COUNTRY_CODE)) num = DEFAULT_COUNTRY_CODE + num;
    return num;
  }

  function buildMessage(){
    const name = nameEl.value.trim();
    const details = detailsEl.value.trim();
    const confirmed = confirmEl.checked;

    let msg = `أهلاً بيك ${name ? name : ''} في ${PHARMACY_NAME} 🌿\n\n`;
    if(confirmed){
      msg += `تم استلام طلبك ✅\n`;
      if(details) msg += `${details}\n`;
    } else {
      if(details) msg += `${details}\n`;
    }
    msg += `\nشكراً لتعاملك معانا 💊`;
    return msg.trim();
  }

  let messageEdited = false; // بيبقى true أول ما الموظف يعدّل الرسالة بإيده

  function updatePreview(){
    if(messageEdited) return; // متعدلش الرسالة تلقائي لو الموظف كتب فيها بإيده
    previewEl.value = buildMessage();
  }
  [nameEl, detailsEl, confirmEl].forEach(el=>{
    el.addEventListener('input', updatePreview);
    el.addEventListener('change', updatePreview);
  });
  previewEl.addEventListener('input', ()=>{ messageEdited = true; });

  document.getElementById('regenBtn').addEventListener('click', ()=>{
    messageEdited = false;
    updatePreview();
  });

  updatePreview();

  function loadLog(){
    const log = JSON.parse(localStorage.getItem('asafra_wa_log') || '[]');
    logBody.innerHTML = '';
    if(log.length === 0){
      emptyLog.style.display = 'block';
      return;
    }
    emptyLog.style.display = 'none';
    log.slice().reverse().forEach(entry=>{
      const tr = document.createElement('tr');
      const method = entry.method === 'auto' ? '🤖 تلقائي' : '✋ يدوي';
      tr.innerHTML = `<td>${entry.time}</td><td>${entry.name || '-'}</td><td>${entry.phone}</td><td>${method}</td>`;
      logBody.appendChild(tr);
    });
  }
  loadLog();

  document.getElementById('clearLog').addEventListener('click', ()=>{
    if(confirm('هتمسح كل سجل الرسائل النهاردة؟')){
      localStorage.removeItem('asafra_wa_log');
      loadLog();
    }
  });

  function saveLogEntry(method){
    const log = JSON.parse(localStorage.getItem('asafra_wa_log') || '[]');
    log.push({
      time: new Date().toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'}),
      name: nameEl.value.trim(),
      phone: phoneEl.value.trim(),
      confirmed: confirmEl.checked,
      method
    });
    localStorage.setItem('asafra_wa_log', JSON.stringify(log));
    loadLog();
  }

  function resetFormAfterSend(){
    phoneEl.value = '';
    nameEl.value = '';
    detailsEl.value = '';
    messageEdited = false;
    updatePreview();
  }

  sendBtn.addEventListener('click', async ()=>{
    const rawPhone = phoneEl.value.trim();
    if(!rawPhone){
      alert('اكتب رقم موبايل العميل الأول 🙏');
      phoneEl.focus();
      return;
    }
    const phone = normalizePhone(rawPhone);
    const message = previewEl.value.trim() || buildMessage();

    sendBtn.disabled = true;
    sendBtn.textContent = '⏳ جاري الإرسال...';

    // المحاولة الأولى: إرسال تلقائي عن طريق السيرفر المحلي (whatsapp-web.js)
    try{
      const res = await fetch(`${SERVER_URL}/send-whatsapp`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ phone, message }),
        signal: AbortSignal.timeout(15000)
      });
      const data = await res.json();
      if(res.ok && data.ok){
        saveLogEntry('auto');
        sendBtn.innerHTML = '<span>📲</span> إرسال واتساب للعميل';
        sendBtn.disabled = false;
        alert('✅ اتبعتت تلقائي للعميل من غير ما تفتح واتساب');
        resetFormAfterSend();
        return;
      }
      throw new Error(data.error || 'فشل الإرسال التلقائي');
    }catch(e){
      // Fallback: السيرفر مش شغال أو فيه مشكلة - نفتح واتساب يدوي
      const link = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      saveLogEntry('manual');
      sendBtn.innerHTML = '<span>📲</span> إرسال واتساب للعميل';
      sendBtn.disabled = false;
      window.open(link, '_blank');
    }
  });
</script>

</body>
</html>
